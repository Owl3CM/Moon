<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moon Icons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── Reset & Design Tokens ──────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f5f6f8;
  --surface: #ffffff;
  --surface-2: #f0f1f4;
  --border: #e2e4ea;
  --border-focus: #4f46e5;
  --text: #1a1d26;
  --text-dim: #6b7280;
  --accent: #20a891;
  --accent-hover: #18866f;
  --danger: #ef4444;
  --success: #22c55e;
  --warning: #f59e0b;
  --purple: #8b5cf6;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-lg: 0 4px 12px rgba(0,0,0,0.08);
  --icon-bg: #ffffff;
  --radius: 10px;
  --radius-lg: 16px;
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --transition: 200ms ease;
}

[data-theme="dark"] {
  --bg: #0f1117;
  --surface: #181a24;
  --surface-2: #1f2233;
  --border: #2a2d3e;
  --text: #e8eaf0;
  --text-dim: #6b7280;
  --shadow: 0 1px 3px rgba(0,0,0,0.3);
  --shadow-lg: 0 4px 12px rgba(0,0,0,0.4);
  --icon-bg: #ffffff;
}

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  min-height: 100vh;
}

/* ── Header ─────────────────────────────────────────────── */
.header {
  position: sticky; top: 0; z-index: 100;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 12px 24px;
  display: flex; align-items: center; gap: 24px;
  box-shadow: var(--shadow);
}

.logo {
  display: flex; align-items: center; gap: 10px;
  flex-shrink: 0;
}
.logo-icon {
  width: 36px; height: 36px; border-radius: 10px;
  background: linear-gradient(135deg, var(--accent), var(--purple));
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 1rem; color: #fff;
}
.logo-text { font-weight: 700; font-size: 0.95rem; }
.logo-sub { font-size: 0.65rem; color: var(--text-dim); }

/* ── Tabs ───────────────────────────────────────────────── */
.tabs {
  display: flex; gap: 2px;
  background: var(--bg); border-radius: 8px; padding: 3px;
}
.tab {
  padding: 6px 16px; border: none; border-radius: 6px;
  background: transparent; color: var(--text-dim);
  font: inherit; font-size: 0.8rem; font-weight: 500;
  cursor: pointer; transition: var(--transition);
  white-space: nowrap;
}
.tab:hover { color: var(--text); }
.tab.active { background: var(--accent); color: #fff; }

/* ── Controls ───────────────────────────────────────────── */
.controls {
  display: flex; align-items: center; gap: 10px;
  margin-left: auto; flex-wrap: nowrap;
}

.search-input {
  background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 7px 14px;
  color: var(--text); font: inherit; font-size: 0.8rem;
  width: 200px; outline: none; transition: var(--transition);
}
.search-input:focus { border-color: var(--accent); }

.select-input {
  background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 7px 10px;
  color: var(--text); font: inherit; font-size: 0.75rem;
  outline: none; cursor: pointer;
}

/* ── Filter Toggle Group ────────────────────────────────── */
.filter-group {
  display: flex; gap: 2px; background: var(--bg);
  border-radius: 6px; padding: 2px;
}
.filter-btn {
  padding: 5px 12px; border: none; border-radius: 5px;
  background: transparent; color: var(--text-dim);
  font: inherit; font-size: 0.72rem; font-weight: 500;
  cursor: pointer; transition: var(--transition);
}
.filter-btn:hover { color: var(--text); }
.filter-btn.active { background: var(--border); color: var(--text); }

/* ── Action Buttons ─────────────────────────────────────── */
.btn {
  padding: 7px 16px; border: none; border-radius: var(--radius);
  font: inherit; font-size: 0.78rem; font-weight: 600;
  cursor: pointer; transition: var(--transition);
  white-space: nowrap;
}
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-accent { background: var(--accent); color: #fff; }
.btn-accent:hover:not(:disabled) { background: var(--accent-hover); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-outline {
  background: transparent; color: var(--accent);
  border: 1px solid var(--accent);
}
.btn-outline:hover:not(:disabled) { background: rgba(32,168,145,0.08); }
.btn-sync { background: var(--surface-2); color: var(--text-dim); border: 1px solid var(--border); }
.btn-sync.has-items { color: var(--accent); border-color: var(--accent); }
.btn-sync.removing { color: var(--danger); border-color: var(--danger); }

/* ── Main Container ─────────────────────────────────────── */
#container {
  max-width: 1400px; margin: 0 auto;
  padding: 20px 24px;
}

/* ── Stats Bar ──────────────────────────────────────────── */
.stats {
  font-size: 0.75rem; color: var(--text-dim);
  padding: 8px 0 12px;
}

/* ── Style Bar ──────────────────────────────────────────── */
.style-bar {
  display: flex; gap: 6px; justify-content: center;
  padding: 12px 0 16px; flex-wrap: wrap;
}
.style-pill {
  padding: 5px 14px; border: 1px solid var(--border);
  border-radius: 20px; background: transparent;
  color: var(--text-dim); font: inherit; font-size: 0.72rem;
  cursor: pointer; transition: var(--transition);
}
.style-pill:hover { border-color: var(--text-dim); color: var(--text); }
.style-pill.active {
  background: var(--accent); border-color: var(--accent);
  color: #fff; font-weight: 600;
}

/* ── Groups (Local Cache) ─────────────────────────────── */
.group {
  margin-bottom: 28px;
}
.group-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  box-shadow: var(--shadow);
}
.group-name { font-weight: 700; font-size: 0.85rem; }
.group-count { font-weight: 400; color: var(--text-dim); }
.group-actions { display: flex; gap: 6px; }
.group-action-btn {
  font: inherit; font-size: 0.65rem; padding: 3px 10px;
  border: 1px solid var(--border); border-radius: 20px;
  background: transparent; color: var(--accent);
  cursor: pointer; transition: var(--transition);
}
.group-action-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
.group-action-btn.remove { color: var(--danger); }
.group-action-btn.remove:hover { background: var(--danger); color: #fff; border-color: var(--danger); }

/* ── Icon Grid ──────────────────────────────────────────── */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
  gap: 10px; padding: 16px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-top: none;
  border-radius: 0 0 var(--radius-lg) var(--radius-lg);
}

/* ── Search Result Groups ───────────────────────────── */
.search-group {
  margin-bottom: 24px;
  border-radius: var(--radius-lg);
  border: 1px solid var(--border);
  overflow: hidden;
  box-shadow: var(--shadow);
}
.search-group-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 18px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.search-group-info { display: flex; align-items: center; gap: 10px; }
.search-group-name { font-weight: 700; font-size: 0.9rem; }
.search-group-count {
  font-size: 0.65rem; color: var(--text-dim);
  background: var(--surface-2); padding: 2px 8px;
  border-radius: 10px;
}
.search-group-action {
  font: inherit; font-size: 0.7rem; padding: 5px 14px;
  border: 1px solid var(--accent); border-radius: 20px;
  background: transparent; color: var(--accent);
  cursor: pointer; transition: var(--transition);
  text-decoration: none;
}
.search-group-action:hover { background: var(--accent); color: #fff; }
.search-group-body {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 10px; padding: 16px;
  background: var(--surface-2);
}

.card {
  display: flex; flex-direction: column;
  align-items: center; gap: 6px;
  padding: 10px 6px 8px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--surface);
  cursor: pointer;
  transition: var(--transition);
  box-shadow: var(--shadow);
}
.card:hover { border-color: var(--accent); box-shadow: var(--shadow-lg); transform: translateY(-1px); }
.card.added { border-color: var(--success); }
.card.selected { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--surface)); }
.card.selected.removing { border-color: var(--danger); background: color-mix(in srgb, var(--danger) 8%, var(--surface)); }

.card-icon {
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  background: var(--icon-bg);
  border-radius: 8px;
  padding: 4px;
  position: relative;
}
.card-icon img {
  width: 28px; height: 28px;
}
.card-icon .card-svg {
  width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
}
.card-icon .card-svg svg {
  width: 100%; height: 100%;
}
/* Color cycling for non-colored icons */
.card:not(.colored) { color: var(--icon-color, var(--text)); }
.card.ic0 { --icon-color: #20a891; }
.card.ic1 { --icon-color: #f59e0b; }
.card.ic2 { --icon-color: #ef4444; }
.card.ic3 { --icon-color: #3b82f6; }
.card.ic4 { --icon-color: #6b7280; }
.card.ic5 { --icon-color: #22c55e; }
.card.ic6 { --icon-color: #8b5cf6; }
/* Load-more sentinel */
.load-more-sentinel {
  grid-column: 1 / -1;
  text-align: center; padding: 12px;
  font-size: 0.72rem; color: var(--text-dim);
}
.card-gear {
  position: absolute; top: 2px; right: 2px;
  width: 18px; height: 18px;
  border: none; background: var(--surface-2);
  border-radius: 50%; font-size: 0.55rem;
  cursor: pointer; display: none;
  align-items: center; justify-content: center;
  color: var(--text-dim); transition: var(--transition);
  line-height: 1;
}
.card:hover .card-gear { display: flex; }
.card-gear:hover { background: var(--accent); color: #fff; }

.card-name {
  font-size: 0.58rem; color: var(--text-dim);
  text-align: center; word-break: break-all;
  max-width: 90px; line-height: 1.3;
  overflow: hidden; text-overflow: ellipsis;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  line-clamp: 2;
}

/* ── Web Search Cards ───────────────────────────────────── */
.web-card {
  display: flex; flex-direction: column;
  align-items: stretch; gap: 8px;
  padding: 12px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--surface);
  transition: var(--transition);
  box-shadow: var(--shadow);
}
.web-card:hover { border-color: var(--accent); box-shadow: var(--shadow-lg); }
.web-card-preview {
  display: flex; align-items: center; justify-content: center;
  background: #ffffff;
  border-radius: 8px; padding: 12px;
  min-height: 56px;
  border: 1px solid #f0f1f4;
}
.web-card-preview img { width: 32px; height: 32px; }
.web-card-name {
  font-size: 0.72rem; text-align: center;
  color: var(--text); font-weight: 500;
}
.web-card .btn { width: 100%; }

/* ── Upload Zone ────────────────────────────────────────── */
.upload-zone {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 80px 40px; min-height: 50vh;
}
.upload-drop {
  width: 100%; max-width: 560px;
  border: 2px dashed var(--border);
  border-radius: var(--radius-lg);
  padding: 60px 40px; text-align: center;
  cursor: pointer; transition: all 300ms ease;
}
.upload-drop:hover { border-color: var(--accent); }
.upload-drop.dragover { border-color: var(--accent); background: rgba(32,168,145,0.04); }
.upload-drop-icon { font-size: 2.5rem; margin-bottom: 12px; opacity: 0.5; }
.upload-drop-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 6px; }
.upload-drop-sub { font-size: 0.8rem; color: var(--text-dim); margin-bottom: 20px; }
.upload-hint {
  margin-top: 16px; font-size: 0.75rem; color: var(--text-dim);
}

/* ── Modal ───────────────────────────────────────────────── */
.modal-overlay {
  display: none; position: fixed; inset: 0; z-index: 1000;
  background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
  align-items: center; justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 24px;
  width: 440px; max-width: 90vw;
  box-shadow: 0 20px 60px rgba(0,0,0,0.4);
}
.modal-title { font-weight: 700; font-size: 1rem; margin-bottom: 16px; }
.modal-preview {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 16px; padding: 12px;
  background: var(--bg); border-radius: var(--radius);
}
.modal-preview img { width: 48px; height: 48px; }
.modal-source { font-size: 0.72rem; color: var(--text-dim); }

.modal-field { margin-bottom: 12px; }
.modal-label {
  display: block; font-size: 0.72rem; font-weight: 600;
  color: var(--text-dim); margin-bottom: 4px;
}
.modal-input {
  width: 100%; background: var(--bg);
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: 8px 12px; color: var(--text);
  font: inherit; font-size: 0.85rem; outline: none;
}
.modal-input:focus { border-color: var(--accent); }
.modal-select {
  width: 100%; background: var(--bg);
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: 8px 12px; color: var(--text);
  font: inherit; font-size: 0.85rem; outline: none; cursor: pointer;
}

.modal-conflict {
  margin: 12px 0; padding: 12px;
  background: rgba(245,158,11,0.08);
  border: 1px solid var(--warning);
  border-radius: var(--radius);
  font-size: 0.8rem;
}
.modal-conflict-label { font-weight: 600; color: var(--warning); margin-bottom: 8px; }
.modal-conflict-icons {
  display: flex; align-items: center; gap: 16px;
}
.modal-conflict-item {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.modal-conflict-item img { width: 40px; height: 40px; }
.modal-conflict-item span { font-size: 0.65rem; color: var(--text-dim); }

.modal-actions {
  display: flex; gap: 8px; justify-content: flex-end;
  margin-top: 16px;
}

/* ── Context Menu ───────────────────────────────────────── */
.context-menu {
  display: none; position: fixed; z-index: 1100;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 4px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  min-width: 160px;
}
.context-menu.open { display: block; }
.context-item {
  padding: 8px 14px; border-radius: 6px;
  font-size: 0.78rem; cursor: pointer;
  transition: var(--transition);
}
.context-item:hover { background: var(--surface-2); }
.context-item.danger { color: var(--danger); }
.context-item.danger:hover { background: rgba(239,68,68,0.08); }

/* ── Toast ──────────────────────────────────────────────── */
.toast {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%) translateY(100px);
  padding: 10px 20px; border-radius: var(--radius);
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text); font-size: 0.8rem; font-weight: 500;
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  transition: transform 300ms ease; z-index: 2000;
  pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.error { border-color: var(--danger); color: var(--danger); }
.toast.success { border-color: var(--success); }

/* ── Drop Overlay ───────────────────────────────────────── */
.drop-overlay {
  display: none; position: fixed; inset: 0; z-index: 2000;
  background: rgba(0,0,0,0.75); backdrop-filter: blur(12px);
  align-items: center; justify-content: center;
  flex-direction: column; pointer-events: none;
}
.drop-overlay.active { display: flex; }
.drop-box {
  padding: 60px 80px;
  border: 3px dashed var(--accent);
  border-radius: 24px;
  background: rgba(32,168,145,0.08);
  text-align: center;
  animation: dropPulse 1.5s ease infinite;
}
@keyframes dropPulse {
  0%, 100% { border-color: var(--accent); box-shadow: 0 0 30px rgba(32,168,145,0.15); }
  50% { border-color: var(--purple); box-shadow: 0 0 50px rgba(139,92,246,0.2); }
}
.drop-box-icon { font-size: 3rem; margin-bottom: 12px; }
.drop-box-title { font-size: 1.25rem; font-weight: 600; }
.drop-box-sub { font-size: 0.8rem; color: var(--text-dim); margin-top: 4px; }

/* ── Empty State ────────────────────────────────────────── */
.empty-state {
  text-align: center; padding: 60px 20px;
  color: var(--text-dim); font-size: 0.9rem;
}

/* ── Loading Spinner ────────────────────────────────────── */
.spinner {
  display: inline-block; width: 20px; height: 20px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 600ms linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Progress Bar ────────────────────────────────────────── */
.progress-bar {
  position: fixed; top: 0; left: 0; width: 100%; height: 3px;
  z-index: 200; background: var(--border); display: none;
}
.progress-bar.active { display: block; }
.progress-fill {
  height: 100%; background: var(--accent);
  transition: width 300ms ease;
  border-radius: 0 2px 2px 0;
}

/* ── Theme Toggle ──────────────────────────────────────── */
.theme-toggle {
  width: 36px; height: 36px;
  border: 1px solid var(--border); border-radius: 50%;
  background: var(--surface-2); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 1rem; transition: var(--transition);
  color: var(--text);
  flex-shrink: 0;
}
.theme-toggle:hover { border-color: var(--accent); }

/* ── Sub-Tabs ───────────────────────────────────────────────── */
.sub-tabs {
  display: flex; gap: 4px; padding: 0 0 16px;
}
.sub-tab {
  padding: 6px 18px; border: 1px solid var(--border);
  border-radius: 20px; background: transparent;
  color: var(--text-dim); font: inherit; font-size: 0.75rem;
  cursor: pointer; transition: var(--transition);
}
.sub-tab:hover { border-color: var(--text-dim); color: var(--text); }
.sub-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }

/* ── Collection Tiles ──────────────────────────────────────── */
.col-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 12px;
}
.col-tile {
  padding: 16px; border: 1px solid var(--border);
  border-radius: var(--radius-lg); background: var(--surface);
  cursor: pointer; transition: var(--transition);
  box-shadow: var(--shadow);
}
.col-tile:hover { border-color: var(--accent); background: var(--surface-2); box-shadow: var(--shadow-lg); transform: translateY(-1px); }
.col-tile-name { font-weight: 600; font-size: 0.85rem; margin-bottom: 2px; }
.col-tile-count { font-size: 0.7rem; color: var(--text-dim); margin-bottom: 10px; }
.col-tile-samples {
  display: flex; gap: 6px;
}
.col-tile-samples img {
  width: 24px; height: 24px;
  background: #fff;
  border-radius: 4px;
  padding: 2px;
  border: 1px solid #eee;
}

/* ── URL Input ────────────────────────────────────────────── */
.url-section {
  margin-top: 32px; padding-top: 24px;
  border-top: 1px solid var(--border);
  width: 100%; max-width: 560px;
  text-align: center;
}
.url-row {
  display: flex; gap: 8px; margin-top: 12px;
}
.url-input {
  flex: 1; background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 8px 14px;
  color: var(--text); font: inherit; font-size: 0.8rem;
  outline: none;
}
.url-input:focus { border-color: var(--accent); }
.quick-link-btn {
  background: var(--surface); border: 1px solid var(--border-bright); color: var(--text);
  font-size: 0.75rem; padding: 6px 14px; border-radius: 20px;
  text-decoration: none; transition: all 0.15s;
  cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
}
.quick-link-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--bg); }

/* ── Back Button ──────────────────────────────────────────── */
.back-row {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 16px;
}
.back-btn {
  padding: 5px 14px; border: 1px solid var(--border);
  border-radius: 20px; background: transparent;
  color: var(--text-dim); font: inherit; font-size: 0.75rem;
  cursor: pointer; transition: var(--transition);
}
.back-btn:hover { border-color: var(--accent); color: var(--accent); }
.back-title { font-weight: 600; font-size: 1rem; }
.back-count { font-size: 0.75rem; color: var(--text-dim); }

/* ── Pagination ──────────────────────────────────────────── */
.paging {
  display: flex; align-items: center; justify-content: center;
  gap: 6px; padding: 16px 0;
}
.page-btn {
  padding: 5px 12px; border: 1px solid var(--border);
  border-radius: 6px; background: transparent;
  color: var(--text-dim); font: inherit; font-size: 0.72rem;
  cursor: pointer; transition: var(--transition);
}
.page-btn:hover { border-color: var(--accent); color: var(--accent); }
.page-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.page-btn:disabled { opacity: 0.3; cursor: not-allowed; }
</style>
</head>
<body>

<!-- ── Header ──────────────────────────────────────────── -->
<div class="header">
  <div class="logo">
    <div class="logo-icon">M</div>
    <div>
      <div class="logo-text">Moon Icons</div>
      <div class="logo-sub">Infinite Vector Pipeline</div>
    </div>
  </div>
  <div class="tabs">
    <button class="tab active" data-tab="local">Local Cache</button>
    <button class="tab" data-tab="web">Web Search</button>
    <button class="tab" data-tab="upload">Upload</button>
  </div>
  <div class="controls">
    <select id="web-source" class="select-input" style="display:none">
      <option value="iconify">Iconify (200k+)</option>
      <option value="svgl">SVGL (Brands)</option>
    </select>
    <select id="web-collection" class="select-input" style="display:none">
      <option value="">All Collections</option>
    </select>
    <input type="text" id="search" class="search-input" placeholder="Search icons...">
    <div id="local-filters" class="filter-group">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="added">Added</button>
      <button class="filter-btn" data-filter="unadded">Unadded</button>
    </div>
    <button id="bulk-btn" class="btn btn-accent" data-action="bulk-add" style="display:none">Add All Visible</button>
    <button id="sync-btn" class="btn btn-sync" data-action="sync" disabled>Sync (0)</button>
  </div>
  <button id="theme-toggle" class="theme-toggle" title="Toggle dark mode">☀</button>
</div>

<div id="progress-bar" class="progress-bar"><div id="progress-fill" class="progress-fill" style="width:0%"></div></div>

<!-- ── Main Content ────────────────────────────────────── -->
<div id="container"></div>

<!-- ── Drop Overlay ────────────────────────────────────── -->
<div id="drop-overlay" class="drop-overlay">
  <div class="drop-box">
    <div class="drop-box-icon">⬇</div>
    <div class="drop-box-title">Drop SVG files here</div>
    <div class="drop-box-sub">They will be uploaded to your icon cache</div>
  </div>
</div>

<!-- ── Add Modal ───────────────────────────────────────── -->
<div id="add-modal" class="modal-overlay">
  <div class="modal">
    <div class="modal-title">Add Icon</div>
    <div id="modal-preview" class="modal-preview"></div>
    <div class="modal-field">
      <label class="modal-label">Icon Name</label>
      <input type="text" id="modal-name" class="modal-input" placeholder="icon-name">
    </div>
    <div class="modal-field">
      <label class="modal-label">Style</label>
      <select id="modal-style" class="modal-select"></select>
    </div>
    <div id="modal-conflict" class="modal-conflict" style="display:none"></div>
    <div class="modal-actions">
      <button id="modal-cancel" class="btn btn-outline">Cancel</button>
      <button id="modal-confirm" class="btn btn-accent">Add Icon</button>
    </div>
  </div>
</div>

<!-- ── Context Menu ────────────────────────────────────── -->
<div id="context-menu" class="context-menu">
  <div class="context-item" data-action="rename">Rename</div>
  <div class="context-item" data-action="toggle-add">Add to Project</div>
  <div class="context-item danger" data-action="delete">Delete</div>
</div>

<!-- ── Toast ───────────────────────────────────────────── -->
<div id="toast" class="toast"></div>

<!-- ── JavaScript ──────────────────────────────────────── -->
<script>
(function() {
  'use strict';

  // ── State ──────────────────────────────────────────────
  var data = null;       // { styles: [], icons: {} }
  var webData = [];      // web search results
  var activeTab = 'local';
  var style = 'All';
  var filter = 'all';
  var query = '';
  var webSource = 'iconify';
  var webCollection = '';
  var isSearchingWeb = false;
  var selected = new Map(); // id → { group, name, added, style }
  var webSubTab = 'browse'; // 'browse' | 'search'
  var browsePrefix = null;  // null = show grid, 'mdi' = show collection icons
  var browseData = null;    // { prefix, name, total, icons: [] }
  var collectionsData = []; // sorted collection list for browsing
  var browsePage = 0;       // current page in collection view
  var ICONS_PER_PAGE = 100;
  var browsePageCache = {};  // { 'prefix:page' → browseData } client-side page cache
  var svgRepoData = null;    // SVGRepo search results
  var svgRepoPage = 1;
  var svgRepoQuery = '';

  // ── DOM References ─────────────────────────────────────
  var $container = document.getElementById('container');
  var $search = document.getElementById('search');
  var $webSource = document.getElementById('web-source');
  var $webCollection = document.getElementById('web-collection');
  var $localFilters = document.getElementById('local-filters');
  var $modal = document.getElementById('add-modal');
  var $contextMenu = document.getElementById('context-menu');
  var $toast = document.getElementById('toast');
  var $dropOverlay = document.getElementById('drop-overlay');
  var $syncBtn = document.getElementById('sync-btn');
  var $bulkBtn = document.getElementById('bulk-btn');
  var $progressBar = document.getElementById('progress-bar');
  var $progressFill = document.getElementById('progress-fill');
  var $themeToggle = document.getElementById('theme-toggle');

  // ── Theme Toggle ───────────────────────────────────────
  var currentTheme = localStorage.getItem('moon-icons-theme') || 'light';
  if (currentTheme === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    $themeToggle.textContent = '\uD83C\uDF19';
  }
  $themeToggle.addEventListener('click', function() {
    var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    if (isDark) {
      document.documentElement.removeAttribute('data-theme');
      $themeToggle.textContent = '\u2600';
      localStorage.setItem('moon-icons-theme', 'light');
    } else {
      document.documentElement.setAttribute('data-theme', 'dark');
      $themeToggle.textContent = '\uD83C\uDF19';
      localStorage.setItem('moon-icons-theme', 'dark');
    }
  });

  // ── Progress Bar ───────────────────────────────────────
  function showProgress(pct) {
    $progressBar.classList.add('active');
    $progressFill.style.width = Math.min(pct, 100) + '%';
  }
  function hideProgress() {
    $progressFill.style.width = '100%';
    setTimeout(function() {
      $progressBar.classList.remove('active');
      $progressFill.style.width = '0%';
    }, 400);
  }


  // ── Init ───────────────────────────────────────────────
  boot();
  loadCollections();
  populateStyleDropdown();

  async function boot() {
    // Check cache status first
    try {
      var statusRes = await fetch('/api/cache-status');
      var status = await statusRes.json();

      if (status.status !== 'done') {
        showCacheLoader(status);
        // Poll until done
        while (true) {
          await new Promise(function(ok) { setTimeout(ok, 2000); });
          try {
            var pollRes = await fetch('/api/cache-status');
            status = await pollRes.json();
            updateCacheLoader(status);
            if (status.status === 'done') break;
          } catch (e) {
            // Server might restart during clone, keep polling
          }
        }
        hideCacheLoader();
      }
    } catch (e) {
      // Server not reachable, proceed anyway
    }

    loadData();
  }

  function showCacheLoader(status) {
    var overlay = document.createElement('div');
    overlay.id = 'cache-loader';
    overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;';
    overlay.innerHTML = '<div style="width:48px;height:48px;border:3px solid var(--border-bright);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite"></div>'
      + '<div style="font-size:1.1rem;font-weight:600;color:var(--text)">Downloading Icon Cache</div>'
      + '<div id="cache-loader-msg" style="font-size:0.8rem;color:var(--text-dim);text-align:center;max-width:400px">' + getCacheMsg(status) + '</div>'
      + '<style>@keyframes spin { to { transform: rotate(360deg); } }</style>';
    document.body.appendChild(overlay);
  }

  function updateCacheLoader(status) {
    var msg = document.getElementById('cache-loader-msg');
    if (msg) msg.textContent = getCacheMsg(status);
  }

  function getCacheMsg(status) {
    if (status.status === 'downloading') return 'Cloning Solar Icon Set repository... This is a one-time setup.';
    if (status.status === 'failed') return 'Download failed: ' + (status.error || 'Unknown error') + '. Retrying...';
    if (status.status === 'done') return status.iconCount + ' icons ready!';
    return 'Checking cache...';
  }

  function hideCacheLoader() {
    var el = document.getElementById('cache-loader');
    if (el) el.remove();
  }

  async function loadData() {
    showProgress(30);
    try {
      var res = await fetch('/api/data');
      data = await res.json();
      hideProgress();
      render();
    } catch (e) {
      hideProgress();
      $container.innerHTML = '<div class="empty-state">Failed to load icons. Is the server running?</div>';
    }
  }

  async function loadCollections() {
    try {
      var res = await fetch('/api/collections');
      var cols = await res.json();
      collectionsData = Object.entries(cols).sort(function(a, b) {
        return (b[1].total || 0) - (a[1].total || 0);
      }).map(function(e) {
        return { prefix: e[0], name: e[1].name, total: e[1].total || 0, samples: e[1].samples || [] };
      });
      // Also populate the dropdown for backwards compat
      for (var i = 0; i < collectionsData.length; i++) {
        var opt = document.createElement('option');
        opt.value = collectionsData[i].prefix;
        opt.textContent = collectionsData[i].name + ' (' + collectionsData[i].total + ')';
        $webCollection.appendChild(opt);
      }
    } catch (e) { /* collections are optional */ }
  }

  function populateStyleDropdown() {
    var sel = document.getElementById('modal-style');
    var styles = ['Bold', 'Outline', 'Line Duotone', 'Broken', 'Linear', 'Bold Duotone', 'Colored'];
    for (var i = 0; i < styles.length; i++) {
      var opt = document.createElement('option');
      opt.value = styles[i];
      opt.textContent = styles[i];
      sel.appendChild(opt);
    }
    sel.value = style;
  }

  // ── Tab Switching ──────────────────────────────────────
  document.querySelectorAll('.tab').forEach(function(tab) {
    tab.addEventListener('click', function() {
      activeTab = this.dataset.tab;
      document.querySelectorAll('.tab').forEach(function(t) { t.classList.toggle('active', t.dataset.tab === activeTab); });

      $localFilters.style.display = activeTab === 'local' ? 'flex' : 'none';
      $webSource.style.display = 'none';
      $webCollection.style.display = 'none';
      $search.style.display = 'inline-block';
      $bulkBtn.style.display = 'none';
      $syncBtn.style.display = activeTab === 'local' ? 'inline-block' : 'none';

      selected.clear();
      updateSyncBtn();
      render();
    });
  });

  // ── Filter Buttons ─────────────────────────────────────
  document.querySelectorAll('.filter-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      filter = this.dataset.filter;
      document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.toggle('active', b.dataset.filter === filter); });
      render();
    });
  });

  // ── Search Input ───────────────────────────────────────
  var searchTimeout;
  $search.addEventListener('input', function() {
    query = this.value.toLowerCase();
    if (activeTab === 'local') {
      render();
    } else if (activeTab === 'web') {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(searchWeb, 500);
    }
  });

  // Enter key on URL input
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && e.target.id === 'url-input') {
      e.preventDefault();
      importFromUrl();
    }
    if (e.key === 'Enter' && e.target.id === 'svgrepo-input') {
      e.preventDefault();
      svgRepoPage = 1;
      searchSvgRepo(e.target.value.trim());
    }
    if (e.key === 'Enter' && e.target.id === 'collection-search') {
      e.preventDefault();
      query = e.target.value.trim().toLowerCase();
      browsePageCache = {}; // clear cache since query changed
      openCollection(browsePrefix, 0);
    }
  });

  // Live filter for collection search
  document.addEventListener('input', function(e) {
    if (e.target.id === 'collection-search') {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(function() {
        query = e.target.value.trim().toLowerCase();
        browsePageCache = {};
        openCollection(browsePrefix, 0);
      }, 400);
    }
  });

  // ── Source & Collection Dropdowns ──────────────────────
  $webSource.addEventListener('change', function() {
    webSource = this.value;
    $webCollection.style.display = webSource === 'iconify' ? 'inline-block' : 'none';
    if (query) searchWeb();
  });

  $webCollection.addEventListener('change', function() {
    webCollection = this.value;
    if (query) searchWeb();
  });
  // ── Open Collection ─────────────────────────────────────
  async function openCollection(prefix, page) {
    browsePrefix = prefix;
    browsePage = page || 0;
    var cacheKey = prefix + ':' + browsePage + ':' + query;

    // Check client cache first
    if (browsePageCache[cacheKey]) {
      browseData = browsePageCache[cacheKey];
      render();
      restoreCollectionSearchFocus();
      return;
    }

    browseData = null;
    showProgress(30);
    render();

    try {
      var url = '/api/collection?prefix=' + encodeURIComponent(prefix) + '&page=' + browsePage + '&limit=' + ICONS_PER_PAGE;
      if (query) url += '&q=' + encodeURIComponent(query);
      var res = await fetch(url);
      browseData = await res.json();
      browsePageCache[cacheKey] = browseData;
    } catch (e) {
      showToast('Failed to load collection: ' + e.message, 'error');
      browsePrefix = null;
    }
    hideProgress();
    render();
    restoreCollectionSearchFocus();
  }

  function restoreCollectionSearchFocus() {
    requestAnimationFrame(function() {
      var input = document.getElementById('collection-search');
      if (input) {
        input.focus();
        input.selectionStart = input.selectionEnd = input.value.length;
      }
    });
  }

  // ── Import from URL ────────────────────────────────────
  async function importFromUrl() {
    var urlInput = document.getElementById('url-input');
    if (!urlInput) return;
    var targetUrl = urlInput.value.trim();
    if (!targetUrl) { showToast('Please enter a URL', 'error'); return; }

    showToast('Fetching SVG...', 'success');
    try {
      var res = await fetch('/api/fetch-url', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url: targetUrl })
      });
      var data = await res.json();
      if (data.error) { showToast(data.error, 'error'); return; }

      // Open modal with the fetched SVG
      openAddModal({ filename: data.filename + '.svg', svgText: data.svg });
      urlInput.value = '';
    } catch (e) {
      showToast('Import failed: ' + e.message, 'error');
    }
  }

  // ── Web Search ─────────────────────────────────────────
  async function searchWeb() {
    if (!query || query.length < 2) { webData = []; render(); return; }
    isSearchingWeb = true;
    render();

    try {
      if (webSource === 'iconify') {
        var palette = (style === 'Colored') ? 'true' : 'false';
        var url = 'https://api.iconify.design/search?query=' + encodeURIComponent(query) + '&limit=100&palette=' + palette;
        if (webCollection) url += '&prefix=' + encodeURIComponent(webCollection);
        var res = await fetch(url);
        var json = await res.json();
        webData = (json.icons || []).map(function(icon) {
          return { type: 'iconify', id: icon, prefix: icon.split(':')[0], name: icon.split(':')[1] };
        });
      } else if (webSource === 'svgl') {
        var res2 = await fetch('https://api.svgl.app/?search=' + encodeURIComponent(query));
        var json2 = await res2.json();
        webData = (json2 || []).map(function(item) {
          var itemUrl = '';
          if (typeof item.route === 'string') itemUrl = item.route;
          else if (item.route) itemUrl = item.route.dark || item.route.light || '';
          return { type: 'svgl', id: item.title, name: item.title, url: itemUrl, category: item.category };
        });
      }
    } catch (e) {
      showToast('Search failed: ' + e.message, 'error');
    }

    isSearchingWeb = false;
    render();
  }

  // ── Render Router ──────────────────────────────────────
  function render() {
    if (activeTab === 'local') renderLocal();
    else if (activeTab === 'web') renderWeb();
    else if (activeTab === 'upload') renderUpload();
  }

  // ── Render: Local Cache ────────────────────────────────
  function renderLocal() {
    if (!data) { $container.innerHTML = '<div class="empty-state"><span class="spinner"></span> Loading...</div>'; return; }
    var scrollY = $container.scrollTop || window.scrollY;

    var icons = data.icons;
    var h = renderStyleBar();

    var totalCount = 0;
    var filteredGroups = [];

    if (style === 'All') {
      // Merge icons across all styles, keyed by group
      var allGroups = {};
      for (var si = 0; si < data.styles.length; si++) {
        var st = data.styles[si];
        var groups = Object.keys(icons);
        for (var gi = 0; gi < groups.length; gi++) {
          var g = groups[gi];
          var items = icons[g][st] || [];
          if (!allGroups[g]) allGroups[g] = {};
          for (var ii = 0; ii < items.length; ii++) {
            var item = items[ii];
            var key = st + '/' + item.name;
            if (!allGroups[g][key]) {
              allGroups[g][key] = { name: item.name, added: item.added, style: st };
            }
          }
        }
      }
      var gNames = Object.keys(allGroups).sort();
      for (var gni = 0; gni < gNames.length; gni++) {
        var gName = gNames[gni];
        var merged = Object.values(allGroups[gName]);
        if (query) merged = merged.filter(function(item) { return item.name.toLowerCase().includes(query); });
        if (filter === 'added') merged = merged.filter(function(item) { return item.added; });
        else if (filter === 'unadded') merged = merged.filter(function(item) { return !item.added; });
        if (merged.length === 0) continue;
        totalCount += merged.length;
        filteredGroups.push({ name: gName, items: merged, allMode: true });
      }
    } else {
      var groups = Object.keys(icons).sort();
      for (var gi = 0; gi < groups.length; gi++) {
        var g = groups[gi];
        var items = icons[g][style] || [];
        if (items.length === 0) continue;

        var filtered = items;
        if (query) {
          filtered = items.filter(function(item) { return item.name.toLowerCase().includes(query); });
        }
        if (filter === 'added') filtered = filtered.filter(function(item) { return item.added; });
        else if (filter === 'unadded') filtered = filtered.filter(function(item) { return !item.added; });

        if (filtered.length === 0) continue;
        totalCount += filtered.length;
        filteredGroups.push({ name: g, items: filtered.map(function(item) { return { name: item.name, added: item.added, style: style }; }) });
      }
    }

    if (filteredGroups.length === 0) {
      h += '<div class="empty-state">No icons match your filters.</div>';
      $container.innerHTML = h;
      updateBulkBtn();
      return;
    }

    h += '<div class="stats"><b>' + totalCount + '</b> icons in <b>' + filteredGroups.length + '</b> groups (' + esc(style) + ')</div>';

    for (var fi = 0; fi < filteredGroups.length; fi++) {
      var fg = filteredGroups[fi];
      h += renderGroup(fg.name, fg.items);
    }

    $container.innerHTML = h;
    window.scrollTo(0, scrollY);
    updateBulkBtn();
    loadInlineSvgs();
    observeLoadMore();
  }

  var ICONS_PER_BATCH = 100;
  var COLOR_COUNT = 7;
  var svgCache = {}; // key → svg string

  function renderGroup(groupName, items) {
    var show = Math.min(items.length, ICONS_PER_BATCH);
    var h = '<div class="group" data-group-name="' + esc(groupName) + '">';
    h += '<div class="group-header">';
    h += '<span class="group-name">' + esc(groupName) + ' <span class="group-count">(' + items.length + ')</span></span>';
    h += '<div class="group-actions">';
    h += '<button class="group-action-btn" data-action="add-all" data-group="' + esc(groupName) + '">Add All</button>';
    h += '<button class="group-action-btn remove" data-action="remove-all" data-group="' + esc(groupName) + '">Remove All</button>';
    h += '</div>';
    h += '</div>';
    h += '<div class="grid">';

    for (var i = 0; i < show; i++) {
      h += renderCard(items[i], groupName, i);
    }

    if (items.length > show) {
      h += '<div class="load-more-sentinel" data-group="' + esc(groupName) + '" data-shown="' + show + '" data-total="' + items.length + '"><span class="spinner"></span> Loading more...</div>';
    }

    h += '</div></div>';
    return h;
  }

  function renderCard(item, groupName, idx) {
    var itemStyle = item.style || style;
    var id = itemStyle + '/' + groupName + '/' + item.name;
    var sel = selected.has(id);
    var isColored = itemStyle === 'Colored';
    var cls = 'card';
    if (item.added) cls += ' added';
    if (sel && item.added) cls += ' selected removing';
    else if (sel) cls += ' selected';
    if (isColored) cls += ' colored';
    else cls += ' ic' + (idx % COLOR_COUNT);

    var h = '<div class="' + cls + '" data-action="toggle-card" data-group="' + esc(groupName) + '" data-name="' + esc(item.name) + '" data-added="' + item.added + '" data-style="' + esc(itemStyle) + '">';
    h += '<div class="card-icon">';
    if (isColored) {
      h += '<img src="/api/icon?style=' + enc(itemStyle) + '&group=' + enc(groupName) + '&name=' + enc(item.name) + '" loading="lazy">';
    } else {
      var cacheKey = itemStyle + '/' + groupName + '/' + item.name;
      if (svgCache[cacheKey]) {
        h += '<div class="card-svg">' + svgCache[cacheKey] + '</div>';
      } else {
        h += '<div class="card-svg" data-svg-key="' + esc(cacheKey) + '"></div>';
      }
    }
    h += '<button class="card-gear" data-action="card-menu" data-group="' + esc(groupName) + '" data-name="' + esc(item.name) + '" data-added="' + item.added + '" data-style="' + esc(itemStyle) + '" title="Actions">\u2699</button>';
    h += '</div>';
    h += '<div class="card-name">' + esc(item.name) + '</div>';
    if (style === 'All') h += '<div style="font-size:0.5rem; color:var(--accent); margin-top:1px;">' + esc(itemStyle) + '</div>';
    h += '</div>';
    return h;
  }

  // ── Batch SVG Loader ─────────────────────────────────────
  function loadInlineSvgs() {
    var els = document.querySelectorAll('.card-svg[data-svg-key]');
    if (els.length === 0) return;
    var batch = [];
    var elMap = {};
    els.forEach(function(el) {
      var key = el.getAttribute('data-svg-key');
      if (!key) return;
      var parts = key.split('/');
      if (parts.length < 3) return;
      batch.push({ style: parts[0], group: parts.slice(1, -1).join('/'), name: parts[parts.length - 1] });
      if (!elMap[key]) elMap[key] = [];
      elMap[key].push(el);
    });
    if (batch.length === 0) return;
    fetch('/api/icons-svg', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ icons: batch })
    })
    .then(function(r) { return r.json(); })
    .then(function(svgs) {
      Object.keys(svgs).forEach(function(key) {
        svgCache[key] = svgs[key];
        var targets = elMap[key] || [];
        targets.forEach(function(el) {
          el.innerHTML = svgs[key];

      });
    })
    .catch(function(err) { console.warn('[moon-icons] batch SVG load failed:', err); });
  }

  // ── Infinite Scroll via IntersectionObserver ─────────────
  var loadMoreObserver = null;

  function observeLoadMore() {
    if (loadMoreObserver) loadMoreObserver.disconnect();
    loadMoreObserver = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (!entry.isIntersecting) return;
        var sentinel = entry.target;
        var groupName = sentinel.getAttribute('data-group');
        var shown = parseInt(sentinel.getAttribute('data-shown'));
        var total = parseInt(sentinel.getAttribute('data-total'));
        if (shown >= total) { sentinel.remove(); return; }

        // Find the items for this group from the current data
        var groupItems = getGroupItems(groupName);
        if (!groupItems) { sentinel.remove(); return; }

        var nextBatch = Math.min(shown + ICONS_PER_BATCH, total);
        var frag = '';
        for (var i = shown; i < nextBatch; i++) {
          frag += renderCard(groupItems[i], groupName, i);
        }

        // Insert before sentinel
        var temp = document.createElement('div');
        temp.innerHTML = frag;
        var grid = sentinel.parentElement;
        while (temp.firstChild) {
          grid.insertBefore(temp.firstChild, sentinel);
        }

        if (nextBatch >= total) {
          sentinel.remove();
        } else {
          sentinel.setAttribute('data-shown', nextBatch);
        }
        loadInlineSvgs();
      });
    }, { rootMargin: '200px' });

    document.querySelectorAll('.load-more-sentinel').forEach(function(el) {
      loadMoreObserver.observe(el);
    });
  }

  function getGroupItems(groupName) {
    if (!data) return null;
    var icons = data.icons;
    if (style === 'All') {
      var merged = {};
      for (var si = 0; si < data.styles.length; si++) {
        var st = data.styles[si];
        var items = icons[groupName] && icons[groupName][st] || [];
        for (var ii = 0; ii < items.length; ii++) {
          var item = items[ii];
          var key = st + '/' + item.name;
          if (!merged[key]) merged[key] = { name: item.name, added: item.added, style: st };
        }
      }
      var result = Object.values(merged);
      if (query) result = result.filter(function(it) { return it.name.toLowerCase().includes(query); });
      if (filter === 'added') result = result.filter(function(it) { return it.added; });
      else if (filter === 'unadded') result = result.filter(function(it) { return !it.added; });
      return result;
    } else {
      var items = icons[groupName] && icons[groupName][style] || [];
      var result = items.map(function(it) { return { name: it.name, added: it.added, style: style }; });
      if (query) result = result.filter(function(it) { return it.name.toLowerCase().includes(query); });
      if (filter === 'added') result = result.filter(function(it) { return it.added; });
      else if (filter === 'unadded') result = result.filter(function(it) { return !it.added; });
      return result;
    }
  }

    contextTarget = {
      group: card.dataset.group,
      name: card.dataset.name,
      added: card.dataset.added === 'true',
      style: card.dataset.style
    };
    var toggleItem = $contextMenu.querySelector('[data-action="toggle-add"]');
    toggleItem.textContent = contextTarget.added ? 'Remove from Project' : 'Add to Project';
    $contextMenu.style.left = e.clientX + 'px';
    $contextMenu.style.top = e.clientY + 'px';
    $contextMenu.classList.add('open');
  });

  $contextMenu.addEventListener('click', function(e) {
    var item = e.target.closest('.context-item');
    if (!item || !contextTarget) return;
    var action = item.dataset.action;

    if (action === 'rename') {
      var newName = prompt('Rename "' + contextTarget.name + '" to:', contextTarget.name);
      if (newName && newName !== contextTarget.name) {
        renameIcon(contextTarget.style, contextTarget.group, contextTarget.name, newName);
      }
    }
    else if (action === 'toggle-add') {
      var entry = { group: contextTarget.group, name: contextTarget.name, style: contextTarget.style };
      if (contextTarget.added) {
        syncApi([], [entry]);
      } else {
        syncApi([entry], []);
      }
    }
    else if (action === 'delete') {
      if (confirm('Delete "' + contextTarget.name + '" from cache' + (contextTarget.added ? ' and project' : '') + '?')) {
        deleteIconApi(contextTarget.style, contextTarget.group, contextTarget.name);
      }
    }

    $contextMenu.classList.remove('open');
    contextTarget = null;
  });

  // ── Sync Button ────────────────────────────────────────
  function updateSyncBtn() {
    var count = selected.size;
    var hasRemove = false;
    selected.forEach(function(v) { if (v.added) hasRemove = true; });
    $syncBtn.textContent = count > 0 ? (hasRemove ? 'Sync (' + count + ')' : 'Add (' + count + ')') : 'Sync (0)';
    $syncBtn.disabled = count === 0;
    $syncBtn.className = 'btn btn-sync' + (count > 0 ? ' has-items' : '') + (hasRemove ? ' removing' : '');
  }

  function updateBulkBtn() {
    var show = activeTab === 'local' && (query.length > 0 || filter === 'unadded');
    $bulkBtn.style.display = show ? 'inline-block' : 'none';
  }

  // ── API Calls ──────────────────────────────────────────
  async function syncSelected() {
    if (selected.size === 0) return;
    $syncBtn.disabled = true;
    $syncBtn.textContent = 'Syncing...';

    var add = [], remove = [];
    selected.forEach(function(v) {
      var syncStyle = v.style || style;
      if (syncStyle === 'All') syncStyle = 'Outline';
      (v.added ? remove : add).push({ group: v.group, name: v.name, style: syncStyle });
    });

    await syncApi(add, remove);
    selected.clear();
    updateSyncBtn();
  }

  async function syncApi(add, remove) {
    try {
      var res = await fetch('/api/sync', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ add: add, remove: remove })
      });
      var r = await res.json();
      showToast(r.errors && r.errors.length ? 'Done with ' + r.errors.length + ' error(s)' : '+' + r.added + ' / -' + r.removed, r.errors && r.errors.length ? 'error' : 'success');
      await loadData();
    } catch (e) {
      showToast('Sync failed: ' + e.message, 'error');
    }
  }

  async function renameIcon(iconStyle, group, oldName, newName) {
    try {
      var res = await fetch('/api/rename', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ style: iconStyle, group: group, oldName: oldName, newName: newName })
      });
      var r = await res.json();
      if (r.errors && r.errors.length) showToast(r.errors[0], 'error');
      else showToast(r.note || 'Renamed', 'success');
      await loadData();
    } catch (e) {
      showToast('Rename failed: ' + e.message, 'error');
    }
  }

  async function deleteIconApi(iconStyle, group, name) {
    try {
      var res = await fetch('/api/delete', {
        method: 'DELETE', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ style: iconStyle, group: group, name: name })
      });
      var r = await res.json();
      if (r.errors && r.errors.length) showToast(r.errors[0], 'error');
      else showToast(r.note || 'Deleted', 'success');
      await loadData();
    } catch (e) {
      showToast('Delete failed: ' + e.message, 'error');
    }
  }

  async function downloadWebIconApi(prefix, name, url, saveName, chosenStyle, overwrite) {
    try {
      var res = await fetch('/api/download', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prefix: prefix, name: name, style: chosenStyle, overwrite: !!overwrite, url: url || undefined, saveName: saveName })
      });
      var r = await res.json();
      if (r.errors && r.errors.length) {
        if (r.errors[0].includes('409 Conflict')) return { conflict: true, slug: r.errors[0].split(': ')[1] };
        showToast('Download failed: ' + r.errors[0], 'error');
        return { error: true };
      }
      showToast(r.note || 'Added to ' + chosenStyle, 'success');
      await loadData();
      return { success: true };
    } catch (e) {
      showToast('Download failed: ' + e.message, 'error');
      return { error: true };
    }
  }

  async function uploadIconApi(filename, svgText, chosenStyle, overwrite) {
    try {
      var res = await fetch('/api/upload', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ filename: filename, svg: svgText, style: chosenStyle, overwrite: !!overwrite })
      });
      var r = await res.json();
      if (r.errors && r.errors.length) {
        if (r.errors[0].includes('409 Conflict')) return { conflict: true, slug: r.errors[0].split(': ')[1] };
        showToast('Upload failed: ' + r.errors[0], 'error');
        return { error: true };
      }
      showToast(r.note || 'Uploaded to ' + chosenStyle, 'success');
      await loadData();
      return { success: true };
    } catch (e) {
      showToast('Upload failed: ' + e.message, 'error');
      return { error: true };
    }
  }

  // ── Add Modal ──────────────────────────────────────────
  var modalState = null; // { mode: 'download'|'upload', ... }

  function openAddModal(opts) {
    // opts: { prefix, name, url, source } for download
    //    or { filename, svgText } for upload
    modalState = opts;
    var preview = document.getElementById('modal-preview');
    var nameInput = document.getElementById('modal-name');
    var styleSelect = document.getElementById('modal-style');
    var conflictDiv = document.getElementById('modal-conflict');

    conflictDiv.style.display = 'none';

    if (opts.svgText) {
      // Upload mode
      var blob = new Blob([opts.svgText], { type: 'image/svg+xml' });
      var blobUrl = URL.createObjectURL(blob);
      preview.innerHTML = '<img src="' + blobUrl + '"><span class="modal-source">Uploaded File</span>';
      nameInput.value = opts.filename.replace(/\.svg$/i, '').toLowerCase().replace(/[\s_]+/g, '-');
    } else {
      // Download mode
      var imgSrc = opts.url || ('https://api.iconify.design/' + opts.prefix + '/' + opts.name + '.svg');
      preview.innerHTML = '<img src="' + esc(imgSrc) + '"><span class="modal-source">' + esc(opts.source) + (opts.prefix ? ' / ' + esc(opts.prefix) : '') + '</span>';
      nameInput.value = (opts.url ? opts.name : opts.prefix + '-' + opts.name).toLowerCase().replace(/[\s_]+/g, '-');
    }

    styleSelect.value = style;
    $modal.classList.add('open');
    nameInput.focus();
    nameInput.select();
  }

  function openUploadModal(filename, svgText) {
    return new Promise(function(resolve) {
      openAddModal({ filename: filename, svgText: svgText });
      // Store resolve AFTER openAddModal so it doesn't get overwritten
      modalState.resolve = resolve;
    });
  }

  document.getElementById('modal-cancel').addEventListener('click', closeModal);
  $modal.addEventListener('click', function(e) { if (e.target === this) closeModal(); });
  document.getElementById('modal-name').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { e.preventDefault(); document.getElementById('modal-confirm').click(); }
  });

  function closeModal() {
    $modal.classList.remove('open');
    if (modalState && modalState.resolve) { modalState.resolve(); modalState = null; }
  }

  document.getElementById('modal-confirm').addEventListener('click', async function() {
    var chosenName = document.getElementById('modal-name').value.trim();
    var chosenStyle = document.getElementById('modal-style').value;
    if (!chosenName) { showToast('Please enter a name', 'error'); return; }
    var fname = chosenName.endsWith('.svg') ? chosenName : chosenName + '.svg';

    var result;
    if (modalState.svgText) {
      // Upload flow
      result = await uploadIconApi(fname, modalState.svgText, chosenStyle, false);
    } else {
      // Download flow
      result = await downloadWebIconApi(modalState.prefix, modalState.name, modalState.url, chosenName, chosenStyle, false);
    }

    if (result && result.conflict) {
      // Show conflict resolution
      var conflictDiv = document.getElementById('modal-conflict');
      conflictDiv.style.display = 'block';
      var newPreview = document.getElementById('modal-preview').innerHTML;
      conflictDiv.innerHTML = '<div class="modal-conflict-label">\u26A0 Icon "' + esc(result.slug) + '" already exists in ' + esc(chosenStyle) + '</div>'
        + '<div style="font-size:0.75rem; color:var(--text-dim); margin-bottom:8px;">An icon with this name is already saved. Choose to replace it or pick a different name.</div>'
        + '<div class="modal-conflict-icons">'
        + '<div class="modal-conflict-item">' + newPreview + '<span>New Icon</span></div>'
        + '</div>'
        + '<div style="margin-top:12px; display:flex; gap:8px;">'
        + '<button class="btn btn-danger" id="conflict-replace">Replace</button>'
        + '<button class="btn btn-outline" id="conflict-rename">Change Name</button>'
        + '</div>';

      document.getElementById('conflict-replace').addEventListener('click', async function() {
        if (modalState.svgText) {
          await uploadIconApi(fname, modalState.svgText, chosenStyle, true);
        } else {
          await downloadWebIconApi(modalState.prefix, modalState.name, modalState.url, chosenName, chosenStyle, true);
        }
        closeModal();
      });
      document.getElementById('conflict-rename').addEventListener('click', function() {
        conflictDiv.style.display = 'none';
        document.getElementById('modal-name').focus();
        document.getElementById('modal-name').select();
      });
      return;
    }

    closeModal();
  });

  // ── File Upload Handler ────────────────────────────────
  async function handleFiles(files) {
    var svgFiles = files.filter(function(f) { return f.name.toLowerCase().endsWith('.svg'); });
    if (svgFiles.length === 0) { showToast('No SVG files found', 'error'); return; }
    for (var i = 0; i < svgFiles.length; i++) {
      var text = await svgFiles[i].text();
      await openUploadModal(svgFiles[i].name, text);
    }
  }

  // ── Global Drag & Drop ─────────────────────────────────
  var dragCounter = 0;
  document.body.addEventListener('dragenter', function(e) {
    e.preventDefault(); dragCounter++;
    $dropOverlay.classList.add('active');
  });
  document.body.addEventListener('dragleave', function(e) {
    e.preventDefault(); dragCounter--;
    if (dragCounter <= 0) { dragCounter = 0; $dropOverlay.classList.remove('active'); }
  });
  document.body.addEventListener('dragover', function(e) { e.preventDefault(); });
  document.body.addEventListener('drop', function(e) {
    e.preventDefault(); dragCounter = 0;
    $dropOverlay.classList.remove('active');
    handleFiles(Array.from(e.dataTransfer.files));
  });

  // ── Bulk Add ───────────────────────────────────────────
  function bulkAddVisible() {
    if (!data) return;
    var icons = data.icons;
    var groups = Object.keys(icons);

    if (style === 'All') {
      for (var gi = 0; gi < groups.length; gi++) {
        var g = groups[gi];
        for (var si = 0; si < data.styles.length; si++) {
          var st = data.styles[si];
          var items = icons[g][st] || [];
          for (var i = 0; i < items.length; i++) {
            if (items[i].added) continue;
            if (query && !items[i].name.toLowerCase().includes(query)) continue;
            if (filter === 'added') continue;
            selected.set(st + '/' + g + '/' + items[i].name, { group: g, name: items[i].name, added: false, style: st });
          }
        }
      }
    } else {
      for (var gi2 = 0; gi2 < groups.length; gi2++) {
        var g2 = groups[gi2];
        var items2 = icons[g2][style] || [];
        for (var i2 = 0; i2 < items2.length; i2++) {
          if (items2[i2].added) continue;
          if (query && !items2[i2].name.toLowerCase().includes(query)) continue;
          if (filter === 'added') continue;
          selected.set(style + '/' + g2 + '/' + items2[i2].name, { group: g2, name: items2[i2].name, added: false, style: style });
        }
      }
    }
    updateSyncBtn(); render();
  }

  // ── Toast ──────────────────────────────────────────────
  function showToast(msg, type) {
    $toast.textContent = msg;
    $toast.className = 'toast show ' + (type || 'success');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function() { $toast.classList.remove('show'); }, 3000);
  }

  // ── Helpers ────────────────────────────────────────────
  function esc(s) {
    if (!s) return '';
    return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function enc(s) { return encodeURIComponent(s); }

})();
</script>
</body>
</html>
